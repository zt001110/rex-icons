<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rex 图标库</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #edf3ff; background: radial-gradient(ellipse at 15% 0%, #18305b 0, transparent 45%), #0a0f19; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 64px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.04em; }
    .subtitle, .status, .footer { color: #9caec8; }
    .subtitle { margin: 0; line-height: 1.6; }
    .json-link { color: #9bc4ff; text-decoration: none; white-space: nowrap; padding: 10px 14px; border: 1px solid #37547e; border-radius: 12px; background: #12213a; }
    .json-link:hover { background: #1a3154; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 24px 0 18px; }
    input { width: min(340px, 100%); padding: 11px 14px; color: inherit; border: 1px solid #2a3a53; border-radius: 11px; background: #101827; outline: none; }
    input:focus { border-color: #6ea8ff; box-shadow: 0 0 0 3px #3d7fe833; }
    .status { margin: 0; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card { overflow: hidden; border: 1px solid #24344a; border-radius: 18px; background: linear-gradient(145deg, #141e2e, #0e1521); box-shadow: 0 14px 38px #0005; }
    .preview { display: grid; place-items: center; height: 220px; padding: 18px; background-color: #080c13; background-image: linear-gradient(45deg, #111925 25%, transparent 25%), linear-gradient(-45deg, #111925 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111925 75%), linear-gradient(-45deg, transparent 75%, #111925 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
    .preview img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .card-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
    .card-info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open-link { color: #9bc4ff; text-decoration: none; font-size: 13px; }
    .empty { grid-column: 1 / -1; padding: 48px 20px; text-align: center; color: #9caec8; border: 1px dashed #35465f; border-radius: 18px; }
    .footer { margin-top: 28px; font-size: 13px; line-height: 1.7; }
    @media (max-width: 620px) { main { padding-top: 32px; } header { align-items: start; flex-direction: column; } .toolbar { align-items: stretch; flex-direction: column; } input { width: 100%; } .preview { height: 190px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">Rex 图标库</h1>
        <p id="description" class="subtitle">读取图标索引中…</p>
      </div>
      <a class="json-link" href="./rex-icons.json">打开 JSON 索引</a>
    </header>
    <section class="toolbar" aria-label="图标工具">
      <input id="search" type="search" placeholder="搜索图标名称" aria-label="搜索图标名称">
      <p id="status" class="status" role="status">正在加载…</p>
    </section>
    <section id="grid" class="grid" aria-label="图标列表"></section>
    <p class="footer">添加图片到 <strong>logos/</strong>，再在 <strong>rex-icons.json</strong> 中填写图片地址，提交后此页会自动更新。</p>
  </main>
  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const search = document.getElementById('search');
    let icons = [];

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const filtered = icons.filter(function (icon) {
        return String(icon.name || '').toLocaleLowerCase().includes(query);
      });
      grid.replaceChildren();
      status.textContent = '共 ' + filtered.length + ' 个图标';
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = icons.length ? '没有匹配的图标。' : '图标索引暂时为空，在 rex-icons.json 中添加图标即可显示。';
        grid.append(empty);
        return;
      }
      filtered.forEach(function (icon) {
        const card = document.createElement('article');
        card.className = 'card';
        const preview = document.createElement('div');
        preview.className = 'preview';
        const image = document.createElement('img');
        image.src = icon.url;
        image.alt = icon.name || '图标';
        image.loading = 'lazy';
        image.decoding = 'async';
        image.onerror = function () { image.alt = '图片暂时无法加载'; };
        preview.append(image);
        const info = document.createElement('div');
        info.className = 'card-info';
        const name = document.createElement('strong');
        name.textContent = icon.name || '未命名图标';
        const open = document.createElement('a');
        open.className = 'open-link';
        open.href = icon.url;
        open.target = '_blank';
        open.rel = 'noopener noreferrer';
        open.textContent = '查看原图';
        info.append(name, open);
        card.append(preview, info);
        grid.append(card);
      });
    }

    search.addEventListener('input', render);
    fetch('./rex-icons.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.icons)) throw new Error('JSON 缺少 icons 数组');
        document.title = (data.name || 'Rex 图标库') + ' · 图标库';
        document.getElementById('title').textContent = data.name || 'Rex 图标库';
        document.getElementById('description').textContent = data.description || 'Rex 图标索引';
        icons = data.icons;
        render();
      })
      .catch(function (error) {
        status.textContent = '加载失败：' + error.message;
        grid.innerHTML = '<div class="empty">请检查 rex-icons.json 是否可访问且格式正确。</div>';
      });
  </script>
</body>
</html>
